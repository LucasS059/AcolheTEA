<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Máscara de recorte no formato suave do coração -->
    <clipPath id="heartClip">
      <path d="M 250,465 C 235,450 35,295 35,170 C 35,80 100,25 185,25 C 220,25 240,40 250,60 C 260,40 280,25 315,25 C 400,25 465,80 465,170 C 465,295 265,450 250,465 Z" />
    </clipPath>
  </defs>

  <!-- Aplica o recorte exato do coração sobre as peças de quebra-cabeça -->
  <g clip-path="url(#heartClip)">
    <!-- 1. Peça Azul (Topo Esquerdo) -->
    <!-- Encaixa macho no amarelo e fêmea no vermelho -->
    <path d="M 0,0 L 250,0 
             L 250,165 
             C 215,165 215,235 250,235 
             L 250,250 
             L 165,250 
             C 165,215 95,215 95,250 
             L 0,250 Z" 
          fill="#1E70EB" />

    <!-- 2. Peça Amarela (Topo Direito) -->
    <!-- Recebe fêmea do azul e encaixa macho no verde -->
    <path d="M 250,0 L 500,0 L 500,250 
             L 375,250 
             C 375,285 305,285 305,250 
             L 250,250 
             L 250,235 
             C 215,235 215,165 250,165 Z" 
          fill="#FACC15" />

    <!-- 3. Peça Vermelha (Base Esquerda) -->
    <!-- Encaixa macho no azul e recebe fêmea do verde -->
    <path d="M 0,250 L 95,250 
             C 95,215 165,215 165,250 
             L 250,250 
             L 250,335 
             C 215,335 215,405 250,405 
             L 250,500 L 0,500 Z" 
          fill="#EF4444" />

    <!-- 4. Peça Verde (Base Direita) -->
    <!-- Recebe fêmea do amarelo e encaixa macho no vermelho -->
    <path d="M 250,250 L 305,250 
             C 305,285 375,285 375,250 
             L 500,250 L 500,500 L 250,500 
             L 250,405 
             C 215,405 215,335 250,335 Z" 
          fill="#22C55E" />
  </g>
</svg>
